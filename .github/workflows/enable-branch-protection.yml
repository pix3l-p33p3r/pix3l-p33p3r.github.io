name: Enable branch protection

# Owner one-shot: add repo secret BRANCH_PROTECTION_TOKEN (classic PAT with "repo" scope
# as pix3l-p33p3r), then run this workflow from the Actions tab.
# Safe to re-run. Deletes nothing.

on:
  workflow_dispatch:

jobs:
  protect-main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Apply main protection via owner PAT
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::Add repository secret BRANCH_PROTECTION_TOKEN (classic PAT with repo scope as the owner), then re-run."
            exit 1
          fi

          curl -sS -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/pix3l-p33p3r/pix3l-p33p3r.github.io/branches/main/protection \
            -d @- <<'EOF'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["build", "branch-naming"]
            },
            "enforce_admins": false,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 0
            },
            "restrictions": null,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "required_conversation_resolution": true,
            "required_linear_history": true
          }
          EOF

          curl -sS -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/pix3l-p33p3r/pix3l-p33p3r.github.io \
            -d '{
              "allow_squash_merge": true,
              "allow_merge_commit": false,
              "allow_rebase_merge": false,
              "delete_branch_on_merge": true,
              "squash_merge_commit_title": "PR_TITLE",
              "squash_merge_commit_message": "PR_BODY"
            }' >/dev/null

          echo "Protection + squash-only merge settings applied."
          curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pix3l-p33p3r/pix3l-p33p3r.github.io/branches/main/protection \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("checks:", d.get("required_status_checks",{}).get("contexts")); print("pr_reviews:", bool(d.get("required_pull_request_reviews")))'
