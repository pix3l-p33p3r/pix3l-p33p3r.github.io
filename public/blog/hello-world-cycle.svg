<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img" aria-labelledby="title desc">
  <title id="title">Directed cycle</title>
  <desc id="desc">Nodes A, B, and C form a directed cycle A to B to C to A.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff4800" />
    </marker>
  </defs>
  <path d="M 142 72 L 96 148" fill="none" stroke="#ff4800" stroke-width="1.75" marker-end="url(#arrow)" />
  <path d="M 106 180 L 214 180" fill="none" stroke="#ff4800" stroke-width="1.75" marker-end="url(#arrow)" />
  <path d="M 224 148 L 178 72" fill="none" stroke="#ff4800" stroke-width="1.75" marker-end="url(#arrow)" />
  <ellipse cx="160" cy="48" rx="36" ry="22" fill="#111" stroke="#ff4800" stroke-width="1.75" />
  <ellipse cx="70" cy="196" rx="36" ry="22" fill="#111" stroke="#ff4800" stroke-width="1.75" />
  <ellipse cx="250" cy="196" rx="36" ry="22" fill="#111" stroke="#ff4800" stroke-width="1.75" />
  <text x="160" y="53" text-anchor="middle" fill="#f5f5f5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">A</text>
  <text x="70" y="201" text-anchor="middle" fill="#f5f5f5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">B</text>
  <text x="250" y="201" text-anchor="middle" fill="#f5f5f5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">C</text>
</svg>
